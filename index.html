<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Flexbox верстка</title>
    <style>
        body {
            margin: 0;
            padding: 35px;
            background-color: #ececec;
            font-family: Tahoma, sans-serif;
        }

        .grid-green {
            display: flex;
            gap: 14px;
            height: 290px;
            margin-bottom: 55px;
        }

        .col-green {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .box-green {
            flex: 1;
            background-color: #0a4d4d;
            color: #ffffff;
            padding: 15px;
            font-size: 15px;
        }

        .grid-gallery {
            display: flex;
            gap: 18px;
            height: 440px;
            width: 100%;
        }

        .col-gallery {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .col-gallery.narrow {
            flex: 0.5;
        }

        .card-item {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            flex: 1;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.18);
        }

        .card-caption {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 10px 15px;
            background-color: rgba(128, 128, 128, 0.6);
            color: #ffffff;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="grid-green">
        <div class="col-green">
            <div class="box-green">1</div>
            <div class="box-green">2</div>
            <div class="box-green">3</div>
        </div>
        <div class="col-green">
            <div class="box-green">4</div>
        </div>
        <div class="col-green">
            <div class="box-green">5</div>
        </div>
    </div>

    <div class="grid-gallery">
        <div class="col-gallery narrow">
            <div class="card-item" style="background-image: url('https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=500&h=350&fit=crop');">
                <div class="card-caption">Рисунок 1</div>
            </div>
            <div class="card-item" style="background-image: url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=500&h=350&fit=crop');">
                <div class="card-caption">Рисунок 2</div>
            </div>
            <div class="card-item" style="background-image: url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=500&h=350&fit=crop');">
                <div class="card-caption">Рисунок 3</div>
            </div>
        </div>
        
        <div class="col-gallery">
            <div class="card-item" style="background-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=500&h=900&fit=crop');">
                <div class="card-caption">Рисунок 4</div>
            </div>
        </div>
        
        <div class="col-gallery">
            <div class="card-item" style="background-image: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?w=500&h=900&fit=crop');">
                <div class="card-caption">Рисунок 5</div>
            </div>
        </div>
    </div>

</body>
</html>
